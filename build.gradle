plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

def testSystemProperties = [
        'baseUrl',
        'browser',
        'headless',
        'browserSize',
        'timeout',
        'remote',
        'selenide.baseUrl',
        'selenide.browser',
        'selenide.headless',
        'selenide.browserSize',
        'selenide.timeout',
        'selenide.remote'
]

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testSystemProperties.each { name ->
        def value = providers.systemProperty(name).orNull
        if (value != null) {
            systemProperty(name, value)
        }
    }
}
