plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

configurations {
    aspectj
}

dependencies {
    testImplementation(
            platform("io.qameta.allure:allure-bom:3.1.1"),
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3",
            "io.qameta.allure:allure-java-commons",
            "io.qameta.allure:allure-jupiter",
            "io.qameta.allure:allure-selenide")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjweaver:1.9.27"
    aspectj "org.aspectj:aspectjweaver:1.9.27"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

def testSystemProperties = [
        'baseUrl',
        'browser',
        'headless',
        'browserSize',
        'timeout',
        'remote',
        'selenide.baseUrl',
        'selenide.browser',
        'selenide.headless',
        'selenide.browserSize',
        'selenide.timeout',
        'selenide.remote'
]

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'allure.results.directory', layout.buildDirectory.dir('allure-results').get().asFile.absolutePath
    jvmArgs "-javaagent:${configurations.aspectj.singleFile.absolutePath}"
    testSystemProperties.each { name ->
        def value = providers.systemProperty(name).orNull
        if (value != null) {
            systemProperty(name, value)
        }
    }
}
